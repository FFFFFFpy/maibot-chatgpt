<style>
*{box-sizing:border-box}body{margin:0;color:var(--maibot-foreground,#202422);font:15px/1.6 var(--maibot-font-body,system-ui),sans-serif}main{width:min(100%,720px);margin:0 auto;padding:clamp(16px,4vw,32px)}h1,h2,h3,p{margin:0}h1{font-size:1.55rem;line-height:1.3}h2{font-size:1.05rem}h3{font-size:.95rem}.intro,.note,.hint{color:var(--maibot-muted,#505754)}.intro{margin:.4rem 0 1.2rem}.card{border:1px solid var(--maibot-border,#c7cfca);border-radius:10px;padding:clamp(16px,3vw,24px);background:var(--maibot-background,transparent)}p+p,h2+p{margin-top:.4em}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.row{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}.badge{border:1px solid currentColor;border-radius:99px;padding:1px 9px;font-size:.82rem;color:var(--maibot-foreground,#285340)}button,input{font:inherit}button{border:1px solid var(--maibot-border,#bec8c1);border-radius:6px;padding:6px 12px;cursor:pointer;color:inherit;background:transparent}button.primary{color:var(--maibot-background,white);background:var(--maibot-foreground,#202422);border-color:transparent}button:hover:not(:disabled){filter:brightness(.87)}button:disabled{opacity:.6;cursor:wait}button:focus-visible,input:focus-visible{outline:2px solid currentColor;outline-offset:3px}label{display:block;font-weight:600;margin:15px 0 5px}input{width:100%;min-width:0;border:1px solid var(--maibot-border,#acb7af);color:inherit;background:transparent;border-radius:5px;padding:8px}hr{border:0;border-top:1px solid var(--maibot-border,#c7cfca);margin:20px 0}ul{display:flex;flex-wrap:wrap;gap:6px;padding:0;margin:.6rem 0 0;list-style:none}li{background:var(--maibot-soft,#edf1ee);padding:2px 8px;border-radius:4px;font-size:.87rem}.note{font-size:.85rem;margin-top:12px}#account,li,#error{overflow-wrap:anywhere}#error:not(:empty){margin:.8rem 0}#live:not(:empty){margin-bottom:.7rem}[hidden]{display:none!important}
</style>
<main><h1>ChatGPT</h1><p class="intro">在 MaiBot 中使用你的 ChatGPT 订阅，无需 API Key。</p><p id="live" role="status">正在读取账号状态…</p><p id="error" role="alert"></p>
<section class="card" id="off" hidden><h2>尚未连接 ChatGPT 账号</h2><p>使用自己的账号登录，并在 OpenAI 官方页面确认授权。</p><div class="controls"><button class="primary" id="start">使用 ChatGPT 继续</button></div></section>
<section class="card" id="wait" hidden><h2>在新标签页登录 ChatGPT</h2><p>复制官方链接，在浏览器的新标签页打开。授权后回到这里。</p><label for="url">官方授权链接</label><input id="url" readonly spellcheck="false"><div class="controls"><button id="copy" class="primary">复制官方授权链接</button><button id="cancel">取消登录</button></div><p class="hint" id="copied" role="status"></p><hr><h3>授权后页面打不开？</h3><p>如果浏览器停在 127.0.0.1，把地址栏的完整网址粘贴到下面。能正常返回的无需填写，本页会自动更新。</p><label for="back">登录返回地址</label><input type="password" autocomplete="off" spellcheck="false" maxlength="12000" id="back" placeholder="粘贴浏览器地址栏的完整网址"><p class="note" id="privacy">这个地址只交给自己的 MaiBot，不要分享。</p><div class="controls"><button id="finish">完成登录</button></div></section>
<section class="card" id="on" hidden><div class="row"><h2 id="account"></h2><span class="badge">已连接</span></div><div class="controls"><button id="models">刷新模型</button><button id="logout">退出登录</button></div><hr><h3>可用模型</h3><p class="hint" id="modelNote" role="status"></p><ul id="list"></ul></section></main>
<script>(()=>{'use strict';const $=id=>document.getElementById(id);let s={},busy=false,rev=0,autoGen=0,message='',origin=location.ancestorOrigins?.[0]||'';window.addEventListener('message',e=>{if(e.source===parent&&e.data?.type==='maibot:connect')origin=e.origin});
function safeLink(v){try{const u=new URL(v);return u.origin==='https://auth.openai.com'&&u.pathname==='/api/accounts/authorize'&&!u.username&&!u.password&&!u.hash?u.href:''}catch{return ''}}
function paint(x){s=x;const signed=x.session==='active', waiting=x.phase==='waiting',working=['preparing','finishing','logging_out'].includes(x.phase);$('off').hidden=signed||waiting||working;$('wait').hidden=!waiting;$('on').hidden=!signed||working;$('live').textContent=({preparing:'正在准备官方登录链接…',finishing:'正在验证授权…',logging_out:'正在退出登录…',expired:'本次登录已过期，请重新开始。',cancelled:'已取消本次登录。'}[x.phase]||'');$('error').textContent=x.problem||message||({missing_direct_scope:'此账号未授予订阅推理权限，请重新授权。',refresh_uncertain:'会话需要重新授权。',auth_required:'请重新登录。'}[x.session]||'');const u=safeLink(x.authorize_url);if($('url').value!==u){$('url').value=u;$('back').value='';$('copied').textContent=''}if(!waiting)$('back').value='';$('privacy').textContent=origin.startsWith('http://')?'管理页使用明文 HTTP，仅在可信网络中粘贴。不要把返回地址发给别人。':'这个地址只交给自己的 MaiBot，不要分享。';$('account').textContent=x.account||'ChatGPT 账号';const items=x.models||[];$('list').replaceChildren(...items.map(m=>{const li=document.createElement('li');li.textContent=m.slug;li.title=m.display_name;return li}));$('modelNote').textContent=x.models_problem|| (x.models_pending?'正在获取可用模型…':items.length?'':'尚未获取模型。');$('models').disabled=!!x.models_pending||busy;if(!signed)autoGen=0;if(signed&&!working&&!busy&&autoGen!==x.generation){autoGen=x.generation;if(!items.length&&!x.models_pending&&!x.models_problem)queueMicrotask(()=>act('models'))}}
async function refresh(){if(busy)return;const n=++rev;try{const x=await maibot.query('status');if(n===rev)paint(x)}catch{if(n===rev)$('error').textContent='无法读取账号状态，请刷新插件页。'}}
async function act(name,args={}){if(busy)return;busy=true;rev++;message='';$('error').textContent='';if(name==='start')$('live').textContent='正在准备官方登录链接…';for(const b of document.querySelectorAll('button'))b.disabled=true;try{const r=await maibot.action(name,args);if(!r.ok)message=name==='finish'?'未识别本次登录的返回地址。请复制授权后地址栏的完整网址。':'状态已改变，请重试。'}catch{message='操作未确认，请稍后重试。'}finally{busy=false;for(const b of document.querySelectorAll('button'))b.disabled=false;await refresh()}}
async function copy(){const input=$('url');if(!safeLink(input.value))return;input.focus();input.select();let ok=false;try{ok=document.execCommand('copy')}catch{}if(!ok){try{await navigator.clipboard.writeText(input.value);ok=true}catch{}}$('copied').textContent=ok?'链接已复制，请在新标签页粘贴并打开。':'链接已选中。按 Ctrl+C（Mac：⌘C），或长按选择「复制」，再在新标签页打开。'}
$('start').onclick=()=>act('start');$('copy').onclick=copy;$('url').onclick=e=>e.target.select();$('cancel').onclick=()=>act('cancel',{attempt:s.attempt});$('models').onclick=()=>act('models');$('logout').onclick=()=>act('logout');function finish(){const raw=$('back').value.trim();$('back').value='';if(!raw||!raw.startsWith("http://127.0.0.1:")){message='请粘贴授权后以 http://127.0.0.1: 开头的完整返回地址。';paint(s);return}act('finish',{callback_url:raw})}$('finish').onclick=finish;$('back').onkeydown=e=>{if(e.key==='Enter')finish()};(async()=>{if(!window.maibot){$('live').textContent='请从 MaiBot 插件页打开。';return}await maibot.ready;await refresh();setInterval(()=>{if(!document.hidden&&(['waiting','preparing','finishing','logging_out'].includes(s.phase)||s.models_pending))refresh()},900);window.addEventListener('focus',refresh);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()})})()})();</script>
