<style>
*{box-sizing:border-box}body{margin:0;color:var(--maibot-foreground,CanvasText);font:15px/1.6 system-ui,sans-serif}main{max-width:680px;padding:clamp(16px,4vw,32px);margin:auto}h1{font-size:1.55rem;margin:0}h2{font-size:1.05rem;margin:0 0 .4em}p{margin:.45em 0 1em}section{padding:1.2em 0;border-top:1px solid var(--maibot-border,#89958f)}button,select,textarea,input{font:inherit;max-width:100%}button{padding:.5em 1em;cursor:pointer}button:disabled{cursor:not-allowed}button,select,textarea{border:1px solid var(--maibot-border,#89958f);border-radius:5px}button.primary{background:var(--maibot-primary,#18553f);color:var(--maibot-primary-foreground,white)}select{padding:.4em;display:block;margin:.5em 0 1em}textarea{width:100%;padding:.45em;resize:vertical}button:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #599f87;outline-offset:2px}[hidden]{display:none!important}details{margin:1em 0}label{display:block}code{overflow-wrap:anywhere}.controls{display:flex;gap:.6em;align-items:center;flex-wrap:wrap}#issue{font-weight:550}#state{margin-top:.6em}</style>
<main><h1>ChatGPT 订阅连接</h1><p id="state" role="status" aria-live="polite">正在读取连接状态…</p><p id="issue" role="alert"></p><p id="httpNotice" hidden>管理页使用明文 HTTP，请仅在可信网络中操作。</p>
<section id="setup" hidden><label for="mode">浏览器与 MaiBot 的位置</label><select id="mode"><option value="desktop">不同设备 / Docker（桌面回调助手）</option><option value="local">同一网络命名空间 / 已配置回环隧道</option></select><p id="hint"></p><button id="start" class="primary">连接 ChatGPT</button></section>
<section id="waiting" hidden><h2 id="next"></h2><p id="steps"></p><label id="matlabel" for="material">一次性配对串</label><textarea id="material" rows="2" readonly spellcheck="false"></textarea><div id="receipt" hidden><p>在官方页面授权后，在本机回调页保存加密回执，再选择该文件：</p><label for="file">登录回执（JSON）</label><input id="file" type="file" accept=".json,application/json"><details><summary>改为粘贴加密回执</summary><label for="manual">仅粘贴助手生成的回执 JSON，不接受回调网址。</label><textarea id="manual" rows="3" spellcheck="false"></textarea><button id="submit">提交回执</button></details></div></section>
<div class="controls"><button id="cancel" hidden>取消本次登录</button><button id="refresh">刷新状态</button></div></main>
<script>(()=>{'use strict';const $=id=>document.getElementById(id);let pending=false,attempt='',phase='',ready=false,serial=0;
let parentOrigin=location.ancestorOrigins?.[0]||'';window.addEventListener('message',e=>{if(e.source===parent&&e.data?.type==='maibot:connect')parentOrigin=e.origin});
const hints={desktop:'浏览器在你手边，MaiBot 在服务器或容器。先在电脑上解压安装包，找到 scripts/desktop_callback.py（Python 3.9+，无需安装依赖）。',local:'仅当桌面 127.0.0.1:1455 确实通向 Runner 同一回环端口时使用。普通 Docker 请选择桌面回调助手。'};
$('mode').onchange=()=>{$('hint').textContent=hints[$('mode').value]};$('mode').onchange();$('material').onclick=e=>e.target.select();
const labels={active:'已连接',not_connected:'未连接',logged_out:'已断开',auth_required:'需重新授权',refresh_uncertain:'需重新授权',missing_direct_scope:'缺少订阅推理权限'};
function draw(s){phase=s.phase;attempt=s.attempt;const busy=['preparing','waiting','finishing'].includes(phase);$('setup').hidden=busy;$('start').textContent=s.session==='active'?'重新连接 ChatGPT':'连接 ChatGPT';$('waiting').hidden=phase!=='waiting';$('cancel').hidden=!['preparing','waiting'].includes(phase);$('state').textContent=(labels[s.session]||'状态未知')+({preparing:' · 正在准备授权…',waiting:' · 等待本人授权（五分钟内有效）',finishing:' · 正在验签并保存…',expired:' · 本次授权已过期',cancelled:' · 本次授权已取消',failed:' · 本次授权未完成'}[phase]||'');if(s.problem)$('issue').textContent=s.problem;
const m=s.material||'';const desk=m.startsWith('MB1.');if($('material').value!==m){$('material').value=m;$('file').value='';$('manual').value=''}$('receipt').hidden=!desk;$('next').textContent=desk?'在桌面浏览器完成授权':'打开官方授权页';$('matlabel').textContent=desk?'一次性配对串':'官方授权链接';$('steps').textContent=desk?'运行 python scripts/desktop_callback.py。选中并复制下面的配对串，在工具提示时粘贴。不要把配对串发给他人。':'在同一台电脑的新标签页打开下面的官方链接。授权后返回本页查看结果，无需粘贴回调地址。';}
async function refresh(){if(!ready||pending)return;const n=++serial;try{const s=await maibot.query('status');if(n===serial)draw(s)}catch{if(n===serial)$('issue').textContent='无法读取状态。请检查插件是否已启用，然后刷新。'}}
async function act(name,args){if(!ready||pending)return;pending=true;++serial;$('issue').textContent='';for(const b of document.querySelectorAll('button,input[type=file]'))b.disabled=true;try{const r=await maibot.action(name,args);if(!r.ok)$('issue').textContent=name==='finish'?'回执无效、已使用或已过期；请选择本次登录的回执。':'登录状态已改变，请刷新后重试。'}catch{$('issue').textContent='操作未确认，请刷新状态后再试。'}finally{pending=false;for(const b of document.querySelectorAll('button,input[type=file]'))b.disabled=false;await refresh()}}
$('start').onclick=()=>act('start',{mode:$('mode').value});$('cancel').onclick=()=>act('cancel',{attempt});$('refresh').onclick=refresh;
async function send(raw){try{if(raw.length>24576)throw 0;const x=JSON.parse(raw);if(x.id!==attempt||!['key','box','iv'].every(k=>typeof x[k]==='string')||Object.keys(x).length!==4)throw 0;await act('finish',{envelope:JSON.stringify(x)})}catch{$('issue').textContent='请选择本次桌面助手保存的回执文件，不要输入授权码或网址。'}}$('submit').onclick=()=>send($('manual').value);$('file').onchange=async()=>{const f=$('file').files[0];if(!f)return;if(f.size>24576){$('issue').textContent='回执文件过大。';return}try{await send(await f.text())}catch{$('issue').textContent='无法读取文件，请使用下方的粘贴方式。'}};
(async()=>{if(!window.maibot){$('state').textContent='请从 MaiBot 插件页面打开。';return}await maibot.ready;ready=true;$('httpNotice').hidden=!parentOrigin.startsWith('http://');await refresh();setInterval(()=>{if(!document.hidden&&['preparing','waiting','finishing'].includes(phase))refresh()},1600)})();})();</script>
