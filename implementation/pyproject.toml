[project]
name = "maibot-chatgpt-provider"
version = "0.2.1"
requires-python = ">=3.12"
dependencies = ["maibot-plugin-sdk==2.23.0", "httpx>=0.28.1,<0.29", "PyJWT>=2.15.1,<3", "cryptography>=50.0.2,<51"]

[dependency-groups]
dev = ["pytest==9.2.0"]

[tool.pytest.ini_options]
addopts = "-m offline --strict-markers"
markers = ["offline: synthetic, no external services", "host: target runner required", "live: explicit personal authorization required"]
