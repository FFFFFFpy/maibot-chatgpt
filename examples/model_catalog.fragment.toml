# 任务包配置片段：由 CLI `config --model` 替换真实 slug 后人工合并至 host/model_catalog.toml。
# 不复制或修改现有 [inner].version；P0 不绑定至依赖工具的 Planner 或视觉任务。

[[api_providers]]
name = "chatgpt_subscription"
client_type = "maibot.chatgpt.subscription"
base_url = "https://api.openai.com/v1"
auth_type = "none" # OAuth 由插件管理，不在宿主配置存 Token。
api_key = ""
max_retry = 1 # 当前研究基线表示含首次的总尝试次数为 1（不额外重试）。
timeout = 200 # 需大于插件 total_timeout_seconds 并留出收尾余量；思考模型可继续调高。

[[models]]
model_type = "llm"
model_identifier = "REPLACE_WITH_AUTHORIZED_MODEL_SLUG"
name = "chatgpt-subscription-text"
api_provider = "chatgpt_subscription"
send_temperature = false
visual = false
